# SSR link previews (events, albums, posts, profiles) need at runtime:
#   API_BASE_URL — backend origin (e.g. https://dev.pxispace.com for test)
#   NEXT_PUBLIC_SITE_URL — canonical web host (e.g. https://test.pxispace.com)
#   NEXT_PUBLIC_R2_PUBLIC_URL — same as backend R2_PUBLIC_URL (absolute og:image URLs)
# Without these, shared links fall back to the PXI logo in iMessage / Instagram / Discord.
#
# If profiles work locally but not on test: the API host may be blocking Netlify egress (Cloudflare
# Bot Fight / WAF). Allow `GET /api/*` from Netlify IPs or lower security for that path; check
# Netlify function logs for `[getPublicProfile] upstream error` status (403/503).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
