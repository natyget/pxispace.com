# SSR (e.g. /u/:id) reads `API_BASE_URL` at runtime in Node — set it in the Netlify UI to your
# backend (same value as NEXT_PUBLIC_API_BASE_URL is fine), so server fetches are not stuck on localhost.
#
# If profiles work locally but not on test: the API host may be blocking Netlify egress (Cloudflare
# Bot Fight / WAF). Allow `GET /api/*` from Netlify IPs or lower security for that path; check
# Netlify function logs for `[getPublicProfile] upstream error` status (403/503).
#
# Analytics env — set ALL FOUR in the Netlify UI (they are baked in at build time,
# so a change needs a redeploy). Every one is fail-closed: a missing id means that
# destination does not load. Never hardcode a fallback.
#   NEXT_PUBLIC_GOOGLE_TAG_ID      GT-…  the single gtag.js loader
#   NEXT_PUBLIC_GA_MEASUREMENT_ID  G-…   GA4 web stream (property 514139578)
#   NEXT_PUBLIC_GOOGLE_ADS_ID      AW-…  Google Ads (enhanced conversions)
#   NEXT_PUBLIC_GTM_ID             GTM-… ad-pixel container ONLY, no GA4 tag inside
# NEXT_PUBLIC_CONSENT_DEFAULT is RETIRED — Consent Mode v2 is region-scoped in code.
#
# Social ad pixels — OPTIONAL and fail-closed. Leave a variable unset and that network's
# script is never injected. Google cannot buy Instagram/Facebook or TikTok inventory, so
# without these there is no way to retarget a site visitor on those apps at all.
#   NEXT_PUBLIC_META_PIXEL_ID     15-16 digits, Meta Events Manager (Instagram + Facebook)
#   NEXT_PUBLIC_TIKTOK_PIXEL_ID   TikTok Ads Manager > Assets > Events > Web Events
#   NEXT_PUBLIC_X_PIXEL_ID        X Ads > Tools > Conversion tracking (the "o..." tag id)
# All three are consent-gated by isTrackingAllowed() and add cookies that are already
# listed in NON_ESSENTIAL_COOKIES and must be listed in the Cookie Policy before launch.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Apple universal links: AASA must be served as JSON with no redirect.
# Short cache so path changes propagate to Apple's CDN quickly.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"

# Security headers (ported from the Vite-era root `_headers` file, which was dead —
# publish dir is `.next`). CSP allowlist covers: Next inline hydration + JSON-LD
# ('unsafe-inline'), tfjs/Human face models ('wasm-unsafe-eval', blob: workers),
# Google/Apple sign-in, Stripe, Apple MusicKit, gtag, Geoapify autocomplete,
# Formspree (pricing form), Spotify + OpenStreetMap embeds, backend API on
# *.pxispace.com, presigned R2 PUTs. img/media stay broad (https:) — avatars/media
# come from R2 + Unsplash + qrserver.
#
# ⚠ THE CSP IS NO LONGER DEFINED HERE. It lived in this block and was INERT: with
# @netlify/plugin-nextjs the pages are served by the Next runtime, so [[headers]]
# only reaches static assets, and a CSP on a PNG governs nothing. The site was
# running with no CSP at all while appearing to have one.
# It now lives in ./csp.js and is emitted by next.config.js `headers()` on the
# document response. Do not re-add it here — two copies will drift.
#
# Rollout switch: set CSP_REPORT_ONLY=1 in the Netlify UI to emit the policy as
# Content-Security-Policy-Report-Only (logs violations, blocks nothing). Ship
# report-only first, walk checkout / face scan / Spotify / Google sign-in / the
# dashboard with the console open, then delete the variable to enforce. Enforcement
# is the default so a forgotten switch fails secure.
#
# Analytics entries: googletagmanager (gtag.js + GTM), google-analytics /
# analytics.google.com (GA4 collect), doubleclick (remarketing), and for Google
# Ads specifically — www.googleadservices.com in script-src (conversion_async.js)
# plus www.google.com + www.googleadservices.com in connect-src (the conversion
# ping and the enhanced-conversions POST both land there).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), geolocation=(), gyroscope=(), camera=(self), microphone=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
