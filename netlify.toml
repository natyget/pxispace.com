# SSR (e.g. /u/:id) reads `API_BASE_URL` at runtime in Node — set it in the Netlify UI to your
# backend (same value as NEXT_PUBLIC_API_BASE_URL is fine), so server fetches are not stuck on localhost.
#
# If profiles work locally but not on test: the API host may be blocking Netlify egress (Cloudflare
# Bot Fight / WAF). Allow `GET /api/*` from Netlify IPs or lower security for that path; check
# Netlify function logs for `[getPublicProfile] upstream error` status (403/503).
#
# Analytics env (Netlify UI): NEXT_PUBLIC_GA_MEASUREMENT_ID, NEXT_PUBLIC_GTM_ID,
# NEXT_PUBLIC_CONSENT_DEFAULT

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Apple universal links: AASA must be served as JSON with no redirect.
# Short cache so path changes propagate to Apple's CDN quickly.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"

# Security headers (ported from the Vite-era root `_headers` file, which was dead —
# publish dir is `.next`). CSP allowlist covers: Next inline hydration + JSON-LD
# ('unsafe-inline'), tfjs/Human face models ('wasm-unsafe-eval', blob: workers),
# Google/Apple sign-in, Stripe, Apple MusicKit, gtag, Geoapify autocomplete,
# Formspree (pricing form), Spotify + OpenStreetMap embeds, backend API on
# *.pxispace.com, presigned R2 PUTs. img/media stay broad (https:) — avatars/media
# come from R2 + Unsplash + qrserver.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), geolocation=(), gyroscope=(), camera=(self), microphone=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://accounts.google.com https://appleid.cdn-apple.com https://js.stripe.com https://js-cdn.music.apple.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.pxispace.com https://*.r2.cloudflarestorage.com https://accounts.google.com https://api.stripe.com https://js.stripe.com https://api.geoapify.com https://formspree.io https://*.music.apple.com https://appleid.apple.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://*.g.doubleclick.net; frame-src https://open.spotify.com https://www.openstreetmap.org https://js.stripe.com https://hooks.stripe.com https://accounts.google.com https://appleid.apple.com https://www.googletagmanager.com https://td.doubleclick.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://appleid.apple.com https://accounts.spotify.com https://checkout.stripe.com; frame-ancestors 'none'; upgrade-insecure-requests"
